# A remote vault with automatic HTTPS.
# Point a DNS record at this machine, then:
#   DOMAIN=cofferdam.example.org docker compose up -d
#   docker compose logs cofferdam   (copy the one-time owner token on first start)
services:
  cofferdam:
    build: .
    restart: unless-stopped
    volumes:
      - ./vault:/vault
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your hostname, e.g. cofferdam.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
